name: Banking App DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Step 1 & 2 - Build & Run Unit Tests
      run: mvn clean package

    - name: Step 5 - Secret Scanning (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Step 6 - Build Docker Image
      run: |
        docker build -t banking-app:latest .

    - name: Step 4 - Vulnerability Scanning (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'banking-app:latest'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
